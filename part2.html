<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body>
  <main class="container py-5">
    <a href="index.html">Back to all tasks</a>
    <h1 class="mb-4">Contact Us</h1>

    <form id="contactForm" action="#" method="post" novalidate>
      <div class="row g-3">

        <div class="col-12 col-md-6">
          <label for="name" class="form-label">Name</label>

          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            placeholder="Enter your name"
            aria-describedby="nameFeedback"
            required
          >

          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback" id="nameFeedback">
            Name is required.
          </div>
        </div>

        <div class="col-12 col-md-6">
          <label for="email" class="form-label">Email</label>

          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="name@example.com"
            aria-describedby="emailHelp emailFeedback"
            required
          >

          <div class="form-text" id="emailHelp">
            Enter an email address where we can contact you.
          </div>

          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback" id="emailFeedback">
            Email is required.
          </div>
        </div>

        <div class="col-12">
          <label for="message" class="form-label">Message</label>

          <textarea
            class="form-control"
            id="message"
            name="message"
            rows="5"
            placeholder="Write your message"
            aria-describedby="messageHelp messageFeedback"
            required
            maxlength="50"
          ></textarea>

          <div class="form-text" id="messageHelp">
            Maximum 50 characters.
          </div>

          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback" id="messageFeedback">
            Message is required.
          </div>
        </div>

        <!-- Submit button -->
        <div class="col-12">
          <button type="submit" class="btn btn-primary">
            Submit
          </button>
        </div>

      </div>

      <p id="formStatus" class="mt-3" role="status"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("contactForm");
    const fields = form.querySelectorAll("input, textarea");
    const emailFeedback = document.getElementById("emailFeedback");
    const formStatus = document.getElementById("formStatus");

    let submitted = false;

    function validateField(field) {
      const valid = field.checkValidity();

      if (valid) {
        field.classList.add("is-valid");
        field.classList.remove("is-invalid");
      } else {
        field.classList.add("is-invalid");
        field.classList.remove("is-valid");
      }

      field.setAttribute("aria-invalid", String(!valid));

      if (field.id === "email") {
        if (field.validity.valueMissing) {
          emailFeedback.textContent = "Email is required.";
        } else {
          emailFeedback.textContent = "Enter a valid email address.";
        }
      }

      return valid;
    }

    form.addEventListener("submit", function (event) {
      // Keep this assignment demo on the page.
      event.preventDefault();
      submitted = true;

      let allValid = true;

      fields.forEach(function (field) {
        if (!validateField(field)) {
          allValid = false;
        }
      });

      if (allValid) {
        formStatus.textContent =
          "All fields are valid! This demo does not send your message.";
      } else {
        formStatus.textContent = "Please correct the highlighted fields.";
        form.querySelector(".is-invalid").focus();
      }
    });

    fields.forEach(function (field) {
      field.addEventListener("input", function () {
        if (submitted) {
          validateField(field);
          formStatus.textContent = "";
        }
      });
    });
  </script>
</body>
</html>
